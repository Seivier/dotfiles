import = ["~/.config/alacritty/themes/themes/one_dark.toml"]

[env]
# TERM = "alacritty"

[font]
size = 14.0

[font.normal]
family = "JetbrainsMono Nerd Font"

[font.offset]
y = 4

[font.glyph_offset]
y = 2 

[window]
decorations = "buttonless"
dynamic_title = true
option_as_alt = "OnlyLeft"
opacity = 0.9
# blur = true

[window.padding]
x = 10
y = 10

[mouse]
hide_when_typing = true


