# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'

#ebbcba rose-pine
#89ca78 onedark-dark
#7aa2f7 tokyonighth
#81A1C1 nord

set -g @minimal-tmux-bg "#ebbcba"
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "centre"
set -g @minimal-tmux-indicator-str " 󰉋 #{b:pane_current_path} "
set -g @minimal-tmux-status-right "  #S "
# set -g @plugin "nordtheme/tmux"

set -g status-interval 5
set -g status-right-length 50
set -g status-left-length 50

set-option -g status-position top

bind-key & kill-window
bind-key x kill-pane

# set-option default-terminal "xterm-256color"
# set-option -sa terminal-features ',xterm-256color:RGB'
# set-option default-terminal "screen-256color"
# set-option -sa terminal-features ',screen-256color:RGB'
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:RGB"
set-option -g focus-events on
set-option -g allow-passthrough all
set-window-option -g aggressive-resize


# Set the control character
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
# bind v split-window -c "#{pane_current_path}"
# bind x split-window -h -c "#{pane_current_path}"


# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on

bind-key v split-window -h -c "#{pane_current_path}" 
bind-key s split-window -v -c "#{pane_current_path}" 

bind-key n next-layout

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R


# Shift arrow to switch windows
bind-key h previous-window
bind-key l next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf

run '~/.tmux/plugins/tpm/tpm'

