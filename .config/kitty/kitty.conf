# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{
# # BEGIN_KITTY_FONTS
# font_family      family="JetBrainsMono Nerd Font Mono"
# # END_KITTY_FONTS

# font_family      SF Mono
# font_family      Menlo 
# font_family      Monaco 
# font_family      Geist Mono
# font_family      family="JetBrains Mono"
# font_family      JetBrainsMono Nerd Font Mono
# font_family      Maple Mono
# font_family      ComicShannsMono Nerd Font Mono
# font_family      Comic Code Ligatures
# font_family      CodeNewRoman Nerd Font Mono
# font_family      MesloLGS Nerd Font 
# font_family      CaskaydiaCove Nerd Font 
font_family      family="Cascadia Code" 
# font_family      Fira Code
# font_family      FiraCode Nerd Font
# font_family      Hack
# font_family      DejaVu Sans Mono
# font_family      IBM Plex Mono


bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 15

disable_ligatures cursor

# modify_font cell_width 100%
modify_font cell_height 140%
# modify_font baseline 0
modify_font underline_position 4

#: }}}

#: Performance tuning {{{

sync_to_monitor yes

#: }}}

#: Window layout {{{

window_margin_width 10 20 10 

hide_window_decorations titlebar-only

#: }}}

#: Color scheme {{{

background_opacity 0.8

background_blur 50

#: }}}

#: Advanced {{{

editor /usr/local/bin/nvim

allow_remote_control socket-only

listen_on unix:/tmp/kitty

#: }}}

#: OS specific tweaks {{{

# wayland_titlebar_color system

# macos_titlebar_color background

macos_option_as_alt left

macos_show_window_title_in all

#: }}}

# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME


