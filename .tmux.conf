# List of plugins
# set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.dotfiles/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'niksingh710/minimal-tmux-status'
# set -g @plugin 'thewtex/tmux-mem-cpu-load'
# set -g @plugin 'feqzz/tmux-spotify-info'

set -g status-interval 1

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#16161e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %I:%M %p #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %H:%M #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "
}

setw -g window-status-activity-style "fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#e0af68]#[bg=#16161e]#[fg=#16161e]#[bg=#e0af68]"
set -g @prefix_highlight_output_suffix ""

set-option -g status-position top
# #ebbcba rose-pine
#  "#89ca78" onedark-dark
# #7aa2f7 tokyonighth
# set -g @minimal-tmux-bg "#7aa2f7"
# set -g @minimal-tmux-justify "left"
# set -g @minimal-tmux-indicator-str "  #S "
# set -g @minimal-tmux-status-right " 󰌢 #($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load -a 0)#[default]   %H:%M  #{spotify-info} "
# set -g @minimal-tmux-status-right-extra ""
# set -g @minimal-tmux-status-left-extra ""
# set -g status-right-length 80
# set -g status-left-length 60


run '~/.tmux/plugins/tpm/tpm'
# run '~/.config/tmux/tokyonight_night.tmux'


bind-key & kill-window
bind-key x kill-pane

set-option -sa terminal-overrides ",xterm-256color:RGB"
set-window-option -g aggressive-resize
set-option -g allow-passthrough on


# Set the control character
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
# bind v split-window -c "#{pane_current_path}"
# bind x split-window -h -c "#{pane_current_path}"


# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on

bind-key v split-window -h -c "#{pane_current_path}" 
bind-key s split-window -v -c "#{pane_current_path}" 

bind-key n next-layout

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R


# Shift arrow to switch windows
bind-key h previous-window
bind-key l next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf


